<style>
  /* Riso print legend: flat ink swatches on paper, numbers in mono. Title uses zullumap's default label. */
  [data-zm-region=legend] { list-style: none; margin: 0; padding: 12px 16px; background: rgba(243, 240, 232, 0.92);
    color: #244C91; font: 0.875rem/1.4 "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  [data-zm-region=legend] li { display: flex; gap: 8px; align-items: center; padding: 2px 0; }
  [data-zm-region=legend] i { display: inline-block; width: 16px; height: 12px; }
  [data-zm-region=legend] .zm-key { margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(36, 76, 145, 0.3); }
</style>
<h1 data-zm-region="title">{{title}}</h1>
<ul data-zm-region="legend">
  {{#legend}}<li><i style="background: {{color}}"></i>{{label}}</li>{{/legend}}
  {{#noData}}<li><i style="background: {{color}}"></i>{{label}}</li>{{/noData}}
  {{#height}}<li class="zm-key">Height: {{low}} to {{high}}</li>{{/height}}
</ul>
<p data-zm-region="credits">Risograph choropleth by Juan Estrada</p>
