# Unit and browser tests on every pull request and on main (eng review D7, D8).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Builds the viewer and CLI first (global setup), then runs the map page, render, world-scale and
      # smoke-trailer tests in software WebGL; the trailer test records 1 s at 10 fps (eng review D8).
      - name: Browser tests (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
